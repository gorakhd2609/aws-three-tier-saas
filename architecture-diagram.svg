<svg width="720" height="640" viewBox="0 0 720 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="640" fill="#ffffff"/>

  <!-- Top row: Users, CloudFront+WAF, S3 -->
  <rect x="40" y="30" width="110" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="95" y="57" text-anchor="middle" font-size="13" fill="#2C2C2A">Users</text>

  <rect x="200" y="30" width="190" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="295" y="49" text-anchor="middle" font-size="13" fill="#0C447C" font-weight="bold">CloudFront + WAF</text>
  <text x="295" y="64" text-anchor="middle" font-size="11" fill="#185FA5">CDN and edge security</text>

  <rect x="440" y="30" width="160" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="520" y="57" text-anchor="middle" font-size="13" fill="#712B13">S3 static assets</text>

  <line x1="150" y1="52" x2="196" y2="52" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="52" x2="394" y2="52" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="295" y1="74" x2="295" y2="100" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VPC container -->
  <rect x="40" y="100" width="640" height="500" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="60" y="126" font-size="14" fill="#173404" font-weight="bold">VPC — 10.0.0.0/16</text>

  <!-- Public subnet -->
  <rect x="70" y="145" width="580" height="80" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="90" y="165" font-size="12" fill="#444441">Public subnet (2 AZs)</text>
  <rect x="280" y="180" width="220" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="390" y="201" text-anchor="middle" font-size="13" fill="#0C447C" font-weight="bold">Load balancer</text>

  <line x1="390" y1="214" x2="390" y2="270" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App subnet -->
  <rect x="70" y="245" width="580" height="105" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="90" y="265" font-size="12" fill="#444441">Private subnet — app tier</text>
  <rect x="270" y="280" width="240" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="390" y="300" text-anchor="middle" font-size="13" fill="#085041" font-weight="bold">ECS Fargate service</text>
  <text x="390" y="318" text-anchor="middle" font-size="11" fill="#0F6E56">Auto-scaling across AZs</text>

  <path d="M390 330 L390 365 L250 365 L250 400" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 330 L390 365 L530 365 L530 400" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Data subnet -->
  <rect x="70" y="360" width="580" height="115" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="90" y="380" font-size="12" fill="#444441">Private subnet — data tier</text>
  <rect x="150" y="400" width="220" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="260" y="420" text-anchor="middle" font-size="13" fill="#712B13" font-weight="bold">RDS PostgreSQL</text>
  <text x="260" y="438" text-anchor="middle" font-size="11" fill="#993C1D">Multi-AZ, encrypted</text>

  <rect x="420" y="400" width="220" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="530" y="420" text-anchor="middle" font-size="13" fill="#26215C" font-weight="bold">ElastiCache Redis</text>
  <text x="530" y="438" text-anchor="middle" font-size="11" fill="#534AB7">Session and query cache</text>

  <!-- Legend -->
  <text x="70" y="505" font-size="12" fill="#444441" font-weight="bold">Legend</text>
  <rect x="70" y="515" width="14" height="14" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="92" y="526" font-size="11" fill="#2C2C2A">Edge / networking</text>
  <rect x="220" y="515" width="14" height="14" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="242" y="526" font-size="11" fill="#2C2C2A">Compute</text>
  <rect x="330" y="515" width="14" height="14" fill="#FAECE7" stroke="#993C1D"/>
  <text x="352" y="526" font-size="11" fill="#2C2C2A">Storage / database</text>
  <rect x="480" y="515" width="14" height="14" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="502" y="526" font-size="11" fill="#2C2C2A">Cache</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
